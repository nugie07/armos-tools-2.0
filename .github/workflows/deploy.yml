name: Deploy

on:
    push:
        branches: [main]

concurrency:
    group: deploy-production
    cancel-in-progress: false

jobs:
    deploy:
        name: Deploy to production
        runs-on: ubuntu-latest
        environment: production

        steps:
            - name: Deploy over SSH
              # No `fingerprint:` — the action then accepts the server's host key
              # without verification (no known_hosts prompt).
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.SSH_HOST }}
                  port: ${{ secrets.SSH_PORT }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  command_timeout: 20m
                  script_stop: true
                  envs: DEPLOY_PATH
                  script: |
                      set -e
                      cd "$DEPLOY_PATH"

                      # The server checkout is a deploy artifact, not a workspace.
                      # .env is gitignored, so it survives the reset.
                      git fetch --all --prune
                      git reset --hard origin/main

                      # Build first, then swap: the old container keeps serving
                      # traffic for the whole build, so downtime is just the swap.
                      docker compose build
                      docker compose up -d --remove-orphans

                      docker compose exec -T app php artisan migrate --force
                      docker compose exec -T app php artisan storage:link || true

                      docker image prune -f
              env:
                  DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

# Rollback (manual, on the server):
#   cd $DEPLOY_PATH
#   git reset --hard <previous-sha>
#   docker compose build && docker compose up -d
#
# Required repository secrets (Settings > Secrets and variables > Actions > Secrets):
#   SSH_HOST         server hostname or IP
#   SSH_PORT         SSH port (e.g. 22)
#   SSH_USER         SSH user, must be in the `docker` group
#   SSH_PRIVATE_KEY  full private key, including the BEGIN/END lines
#
# Required repository variable (same page, Variables tab):
#   DEPLOY_PATH      absolute path to the repo on the server (e.g. /srv/armos-tools)
